name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore TestProject1/TestProject1.csproj

      - name: Build project
        run: dotnet build TestProject1/TestProject1.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TestProject1/TestProject1.csproj --configuration Release --no-build
